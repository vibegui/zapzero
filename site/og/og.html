<!doctype html>

<html><head><meta charset="utf-8"><style>
@font-face{font-family:Archivo;font-weight:300 900;font-stretch:62% 125%;src:url(../public/fonts/archivo-latin.woff2) format("woff2")}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#0b0d0c;color:#e8ebe9;font-family:Archivo,system-ui,sans-serif;overflow:hidden}
.glow{position:absolute;right:-180px;bottom:-260px;width:820px;height:820px;border-radius:50%;background:radial-gradient(circle,rgba(47,191,127,.30),rgba(47,191,127,0) 62%)}
.wrap{position:relative;height:100%;padding:64px 72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-weight:750;font-size:30px;letter-spacing:-.02em}
.logo{width:44px;height:44px;border-radius:12px;background:#2fbf7f;display:grid;place-items:center}
.logo i{width:20px;height:20px;border-radius:50%;border:4.5px solid #05130c}
.dom{margin-left:auto;font:500 22px/1 ui-monospace,"SF Mono",Menlo,monospace;color:#93a09a}
h1{margin-top:auto;font-weight:850;font-stretch:112%;font-size:132px;line-height:.9;letter-spacing:-.045em}
p{margin-top:26px;font-size:32px;line-height:1.25;color:#93a09a;max-width:760px;letter-spacing:-.01em}
p b{color:#e8ebe9;font-weight:600}
.keys{position:absolute;right:72px;bottom:64px;display:flex;gap:10px}
.keys span{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;font:700 26px/1 Archivo;background:#121514;border:1px solid #222826;box-shadow:0 4px 0 #050606;color:#e8ebe9}
.keys span.e{color:#2fbf7f}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="brand"><div class="logo"><i></i></div>zapzero<span class="dom">zapzero.dev</span></div>
<h1>Zere o<br>WhatsApp.</h1>
<p><b>Inbox zero pro WhatsApp.</b> Sem bot, sem risco,<br>sem sair do seu Mac.</p>
<div class="keys"><span>Y</span><span>Y</span><span>Y</span><span class="e">E</span><span>Y</span></div>
</div></body></html>
