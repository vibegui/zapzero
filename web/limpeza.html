<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limpeza do WhatsApp</title>
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)">
<style>
:root {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --line: #2c2c2a;
  --ink: #f0efec; --ink2: #c3c2b7; --muted: #8b8a82; --accent: #3987e5; --warn: #c98500;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f4f4f2; --surface: #fcfcfb; --line: #e2e1dc;
    --ink: #0b0b0b; --ink2: #52514e; --muted: #7a7973; --accent: #2a78d6; --warn: #b07800;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 0 16px 96px; }
main { max-width: 860px; margin: 0 auto; }
header { padding: 24px 0 8px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--ink2); margin: 0; }
.sub a { color: var(--accent); }
.tools { position: sticky; top: 0; background: var(--bg); padding: 12px 0; z-index: 2; display: flex; gap: 8px; }
input[type=search] { flex: 1; min-width: 0; font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
section { margin: 20px 0; }
.sec-head { display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.sec-head h2 { font-size: 16px; margin: 0; flex: 1; }
.sec-head .count { color: var(--muted); font-variant-numeric: tabular-nums; }
.sec-desc { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; cursor: pointer; }
.link { border: 0; background: none; color: var(--accent); padding: 4px; font-size: 13px; }
ul { list-style: none; margin: 0; padding: 0; }
li label { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
li input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.name { font-weight: 600; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 13px; }
.meta .unread { color: var(--warn); }
.prev { color: var(--ink2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li.off .name { color: var(--muted); font-weight: 400; }
.more { display: block; margin: 8px auto; }
footer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
footer div { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
footer strong { font-variant-numeric: tabular-nums; }
footer .state { color: var(--muted); font-size: 13px; flex: 1; }
footer .state.err { color: var(--warn); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Limpeza do WhatsApp</h1>
    <p class="sub">Marcado = arquivar. Nada acontece no WhatsApp até você mandar executar. Arquivar é reversível e não marca nada como lido. Lista de <span id="gerado"></span> · <a href="./">voltar ao radar</a></p>
  </header>
  <div class="tools"><input type="search" id="q" placeholder="Filtrar por nome ou mensagem"></div>
  <div id="secs"></div>
</main>
<footer><div><span><strong id="total">0</strong> para arquivar</span><span class="state" id="state">salva sozinho a cada mudança</span></div></footer>
<script>
const DATA = __DATA__;
const SECOES = [
  ["grupos-mortos", "Grupos mortos", "Sem mensagem há 90 dias ou mais. Decidido só pela data: o Mac não baixou mensagens tão antigas. Os que têm não lidas vêm desmarcados."],
  ["grupos-parados", "Grupos parados", "Última mensagem entre 30 e 90 dias. Desmarcados os grupos onde você escreveu."],
  ["empresas", "Empresas e mensagens automáticas", "Lojas, bancos, códigos, notificações. Jev/Haiku: ninguém espera resposta."],
  ["desconhecidos", "Desconhecidos", "Fora da agenda e você nunca respondeu."],
  ["encerradas", "Conversas encerradas", "Ninguém esperando ninguém. Pessoais vêm desmarcadas."],
  ["dms-antigas", "Conversas antigas", "Paradas há 90+ dias, sem mensagens sincronizadas pra ler."],
];
const PAGE = 60;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const quando = i => !i.ultima ? "sem data" : i.dias === 0 ? "hoje" : i.dias === 1 ? "ontem" : i.dias < 60 ? `há ${i.dias} dias`
  : `parado desde ${MES[+i.ultima.slice(5, 7) - 1]}/${i.ultima.slice(0, 4)}`;
const marcado = new Map(DATA.itens.map(i => [i.pk, i.marcado]));
const limite = {};
let filtro = "";
document.getElementById("gerado").textContent = DATA.gerado;

function render() {
  const q = filtro.toLowerCase();
  document.getElementById("secs").innerHTML = SECOES.map(([id, titulo, desc]) => {
    const todos = DATA.itens.filter(i => i.secao === id);
    const itens = q ? todos.filter(i => (i.nome + " " + i.preview).toLowerCase().includes(q)) : todos;
    if (!itens.length) return "";
    const on = todos.filter(i => marcado.get(i.pk)).length;
    const n = limite[id] ?? PAGE;
    return `<section>
      <div class="sec-head"><h2>${esc(titulo)}</h2><span class="count">${on} de ${todos.length}</span>
        <button class="link" data-all="${id}">todos</button><button class="link" data-none="${id}">nenhum</button></div>
      <p class="sec-desc">${esc(desc)}</p>
      <ul>${itens.slice(0, n).map(i => `<li class="${marcado.get(i.pk) ? "" : "off"}"><label>
        <input type="checkbox" data-pk="${i.pk}" ${marcado.get(i.pk) ? "checked" : ""}>
        <span><span class="name">${esc(i.nome)}</span>
          <div class="meta">${quando(i)}${i.unread > 0 ? ` · <span class="unread">${i.unread} não lidas</span>` : ""}${i.motivo ? " · " + esc(i.motivo) : ""}</div>
          ${i.preview ? `<div class="prev">${esc(i.preview)}</div>` : ""}</span></label></li>`).join("")}</ul>
      ${itens.length > n ? `<button class="more" data-more="${id}">mostrar mais ${Math.min(PAGE, itens.length - n)} de ${itens.length - n}</button>` : ""}
    </section>`;
  }).join("");
  document.getElementById("total").textContent = [...marcado.values()].filter(Boolean).length;
}

let timer;
function salvar() {
  clearTimeout(timer);
  const st = document.getElementById("state");
  st.className = "state"; st.textContent = "salvando…";
  timer = setTimeout(async () => {
    const arquivar = DATA.itens.filter(i => marcado.get(i.pk)).map(i => i.pk);
    const manter = DATA.itens.filter(i => !marcado.get(i.pk)).map(i => i.pk);
    try {
      const r = await fetch("decisoes", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ gerado: DATA.gerado, arquivar, manter }) });
      if (!r.ok) throw new Error(r.status);
      st.textContent = "salvo às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    } catch (e) { st.className = "state err"; st.textContent = "não salvou (" + e.message + "), tenta de novo"; }
  }, 400);
}

document.addEventListener("change", e => {
  const pk = e.target.dataset?.pk;
  if (!pk) return;
  marcado.set(Number(pk), e.target.checked);
  e.target.closest("li").className = e.target.checked ? "" : "off";
  document.getElementById("total").textContent = [...marcado.values()].filter(Boolean).length;
  render(); salvar();
});
document.addEventListener("click", e => {
  const d = e.target.dataset ?? {};
  if (d.more) { limite[d.more] = (limite[d.more] ?? PAGE) + PAGE; render(); }
  const sec = d.all || d.none;
  if (sec) { DATA.itens.filter(i => i.secao === sec).forEach(i => marcado.set(i.pk, Boolean(d.all))); render(); salvar(); }
});
document.getElementById("q").addEventListener("input", e => { filtro = e.target.value; render(); });

fetch("decisoes.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(s => {
  if (s) {
    s.arquivar.forEach(pk => marcado.has(pk) && marcado.set(pk, true));
    s.manter.forEach(pk => marcado.has(pk) && marcado.set(pk, false));
    document.getElementById("state").textContent = "decisões anteriores carregadas";
  }
}).catch(() => {}).finally(render);
</script>
</body>
</html>
